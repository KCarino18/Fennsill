name: Build factory firmware

on:
  workflow_dispatch:
  push:
    paths:
      - "firmware/fennsill/**"
      - "templates/make_splash.py"
      - "templates/fennsill_splash_source.jpg"
      - ".github/workflows/build-firmware.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | sh
          echo "$PWD/bin" >> "$GITHUB_PATH"

      - name: Install ESP32 core + Seeed_GFX
        run: |
          arduino-cli config init
          arduino-cli config set board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install --git-url https://github.com/Seeed-Studio/Seeed_GFX.git

      - name: Compile full Fennsill firmware
        run: |
          mkdir -p factory/prebuilt
          arduino-cli compile \
            --fqbn esp32:esp32:XIAO_ESP32S3_Plus \
            --export-binaries \
            --output-dir factory/prebuilt \
            firmware/fennsill
          ls -la factory/prebuilt
          # Prefer merged image when arduino-cli produces it; keep all bins.
          find factory/prebuilt -type f | sort

      - name: Upload prebuilt artifact
        uses: actions/upload-artifact@v4
        with:
          name: fennsill-firmware-prebuilt
          path: factory/prebuilt/
          if-no-files-found: error
