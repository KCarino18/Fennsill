<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html,body{margin:0;width:800px;height:480px;background:#fff;color:#000;font-family:Georgia,serif;overflow:hidden}
.wrap{padding:28px 36px;box-sizing:border-box;height:480px}
h1{margin:0 0 8px;font-size:42px;letter-spacing:.04em}
.sub{margin:0 0 28px;font-size:18px}
ul{margin:0;padding-left:22px;font-size:22px;line-height:1.7}
.chart{display:flex;align-items:flex-end;gap:18px;height:160px;margin-top:28px;border-bottom:3px solid #000;padding-bottom:6px}
.bar{width:70px;background:#000}
.lbl{display:flex;gap:18px;margin-top:8px;font-size:14px}
.lbl span{width:70px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<h1>TODAY</h1>
<p class="sub">Artiphact sample dashboard</p>
<ul>
<li>Plug in panel</li>
<li>Open Artiphact.exe</li>
<li>Ask any AI for a page</li>
</ul>
<div class="chart">
<div class="bar" style="height:40%"></div>
<div class="bar" style="height:70%"></div>
<div class="bar" style="height:55%"></div>
<div class="bar" style="height:90%"></div>
<div class="bar" style="height:65%"></div>
</div>
<div class="lbl"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span></div>
</div>
</body>
</html>
