<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fennsill — Send page</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font-family: Georgia, serif; background: #f3efe6; color: #111; }
    main { max-width: 720px; margin: 0 auto; padding: 24px 18px 48px; }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: 0.04em; }
    p { line-height: 1.45; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; }
    input, textarea {
      width: 100%; box-sizing: border-box; font: 16px/1.4 ui-monospace, Consolas, monospace;
      border: 2px solid #111; background: #fff; padding: 10px; border-radius: 0;
    }
    textarea { min-height: 220px; }
    button {
      margin-top: 16px; width: 100%; padding: 14px; border: 0; background: #111; color: #f7f4ec;
      font: 18px/1 Georgia, serif; letter-spacing: 0.04em; cursor: pointer;
    }
    .hint { font-size: 14px; opacity: 0.85; }
    .ok { color: #1a5c2e; }
    .err { color: #8a1f1f; }
  </style>
</head>
<body>
  <main>
    <h1>FENNSILL</h1>
    <p>Paste an 800×480 black/white HTML page from <strong>any</strong> AI (phone or computer), then send it to the panel.</p>
    <label for="token">Access token</label>
    <input id="token" type="password" autocomplete="off" placeholder="From Fennsill → Copy full setup">
    <label for="title">Title (optional)</label>
    <input id="title" type="text" placeholder="Today">
    <label for="html">HTML from your AI</label>
    <textarea id="html" placeholder="<!DOCTYPE html>…"></textarea>
    <button id="send" type="button">Send to panel</button>
    <p id="status" class="hint"></p>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const hash = new URLSearchParams((location.hash || "").replace(/^#/, ""));
    const saved = localStorage.getItem("fennsill_token") || "";
    const tokenEl = document.querySelector("#token");
    tokenEl.value = params.get("token") || hash.get("token") || saved;
    document.querySelector("#send").onclick = async () => {
      const status = document.querySelector("#status");
      const token = tokenEl.value.trim();
      const html = document.querySelector("#html").value;
      const title = document.querySelector("#title").value.trim();
      status.className = "hint";
      status.textContent = "Sending…";
      try {
        const res = await fetch("/v1/pages", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token,
          },
          body: JSON.stringify({ html, title, push: true, source: "drop-page" }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "Send failed");
        localStorage.setItem("fennsill_token", token);
        status.className = "ok";
        status.textContent = data.note || ("Sent. Page " + (data.page_id || ""));
      } catch (err) {
        status.className = "err";
        status.textContent = err.message || "Send failed";
      }
    };
  </script>
</body>
</html>
