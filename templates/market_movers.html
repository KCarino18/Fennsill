<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Market Movers</title>
  <style>
    html, body { margin: 0; background: #111; }
    .panel {
      width: 800px;
      height: 480px;
      background: #fff;
      color: #000;
      font-family: "Arial Narrow", "Franklin Gothic Medium", Impact, sans-serif;
      box-sizing: border-box;
      overflow: hidden;
    }
    .band {
      height: 64px;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      letter-spacing: 0.14em;
    }
    .brand { font-size: 28px; font-weight: 700; }
    .date { font-size: 22px; letter-spacing: 0.12em; }
    .body { padding: 20px 28px 0; }
    h1 {
      margin: 0 0 16px;
      font-size: 42px;
      letter-spacing: 0.08em;
      font-weight: 800;
    }
    .rule { height: 6px; background: #000; margin-bottom: 16px; }
    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left;
      font-size: 16px;
      letter-spacing: 0.16em;
      padding: 0 0 8px;
      border-bottom: 2px solid #000;
    }
    th.num, td.num { text-align: right; }
    td {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 6px 0;
      border-bottom: 1px solid #000;
    }
    .footer {
      margin-top: 8px;
      font-size: 14px;
      letter-spacing: 0.18em;
    }
  </style>
</head>
<body>
  <main class="panel">
    <header class="band">
      <div class="brand">ARTIPHACT</div>
      <div class="date">NOV 3</div>
    </header>
    <div class="body">
      <h1>MARKET MOVERS</h1>
      <div class="rule"></div>
      <table>
        <thead>
          <tr>
            <th>TICKER</th>
            <th class="num">LAST</th>
            <th class="num">CHANGE</th>
          </tr>
        </thead>
        <tbody>
          <tr><td>NVDA</td><td class="num">142.18</td><td class="num">+2.4%</td></tr>
          <tr><td>AAPL</td><td class="num">228.05</td><td class="num">-0.6%</td></tr>
          <tr><td>MSFT</td><td class="num">428.90</td><td class="num">+1.1%</td></tr>
          <tr><td>AMZN</td><td class="num">197.40</td><td class="num">+0.8%</td></tr>
          <tr><td>META</td><td class="num">592.15</td><td class="num">-1.3%</td></tr>
          <tr><td>GOOGL</td><td class="num">176.22</td><td class="num">+0.4%</td></tr>
        </tbody>
      </table>
      <div class="footer">REFRESHES ON ITS OWN</div>
    </div>
  </main>
</body>
</html>
